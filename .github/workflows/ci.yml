name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format + clippy + cargo test (lib, bin, integration). tulisp /
  # tulisp-async / tulisp-fmt are normal crates.io releases per
  # Cargo.toml; the proto roots (microgrid, assets, dispatch) are
  # vendored as this repo's own submodules, so `submodules:
  # recursive` is all the checkout needs.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  # Check the whole ui-assets/ directory (HTML, CSS, and hand-written
  # JS), then run the node gates over it. Vendored libs elsewhere in
  # the repo are untouched because the Makefile scopes `check` to the
  # ui-assets path. `check` also runs the organizeImports assist, not
  # just the linter, so an unsorted import/export specifier list fails
  # as an error too.
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Biome (pinned to biome.json's $schema version) plus every
      # node-only gate, in the order the Makefile lists them.
      - name: ui-test
        run: make ui-test

  # Lint, format-check, and type-check the Python client under python/.
  # Dev tools + dependencies only: `--no-install-project` skips building
  # the maturin (Rust) wheel — ruff and ty analyze the source and only
  # need the dependencies resolvable, so the job stays fast (no cargo,
  # protoc, or submodules). Cheap enough to run on every PR unfiltered.
  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Sync dev tools
        run: uv sync --no-install-project

      # `--no-sync` keeps `uv run` from re-syncing WITH the project,
      # which would defeat `--no-install-project` above and kick off
      # the maturin build after all.
      - name: Ruff lint
        run: uv run --no-sync ruff check src tests examples

      - name: Ruff format
        run: uv run --no-sync ruff format --check src tests examples

      - name: Type check (ty, all rules as errors)
        run: uv run --no-sync ty check --error all src

  # Run the Python test suite — the pytest plugin's gates, the client's
  # stream handling, and the live tests that boot a real server.
  #
  # Unlike python-lint, this job builds the crate. `uv sync` here is
  # deliberately WITHOUT `--no-install-project`, so it runs the maturin
  # build of the project wheel, which needs protoc and the vendored
  # proto submodules. python-lint skips all of that on purpose — ruff
  # and ty only read the source — but the tests import the installed
  # package and launch the binary, so here the build is the point. Two
  # things fall out of that sync: the wheel drops the `macrocosim`
  # binary into the venv's scripts directory, which `uv run` puts on
  # PATH, so the live tests' binary discovery finds it with no
  # MACROCOSIM_BIN to set (and they skip rather than fail if it is ever
  # missing); and the package's pytest11 entry point is registered, so
  # pytest auto-loads the plugin under test.
  #
  # maturin builds RELEASE, so none of the debug artifacts the `rust`
  # job caches are reusable here — this job keeps its own `-pywheel-`
  # cache (a prefix no other job restores by) and depends on nothing,
  # running in parallel with the rest.
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry + release target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pywheel-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-pywheel-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Sync (builds the release wheel)
        run: uv sync

      - name: pytest
        run: uv run --no-sync pytest -q

  # Live browser smoke: boots the binary against a scratch Berlin-demo
  # microgrid (`make ui-e2e`, the same target AGENTS.md gives for
  # running tools/ui-smoke/live-topology.mjs by hand) and drives the
  # real SPA with Playwright/Chromium — inspector knobs, dialogs, the
  # metrics panel, hover cards, the steam-boiler round trip end to end.
  # `ui-test`'s DOM-shim boot smoke misses regressions here since
  # it never drives a browser against a live server.
  ui-e2e:
    runs-on: ubuntu-latest
    # Only `rust`: this is also the sole job that boots the binary,
    # so a JS lint failure must not skip the server-boot signal.
    needs: rust
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache the downloaded Chromium build, keyed on the Makefile that
      # pins the Playwright version: a bumped pin misses the exact key
      # and restores the previous build, which the reinstall supersedes.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # No package.json in this repo — tools/ui-smoke's only dependency
      # is the playwright package itself, installed loose into the
      # gitignored node_modules at the version the Makefile pins. The
      # runner also needs Chromium's OS libraries, which the Makefile
      # leaves to the OS.
      - name: Install Playwright + Chromium
        run: |
          make ui-e2e-deps
          npx playwright install-deps chromium

      # Builds the binary, boots a scratch server on OS-chosen ports,
      # runs the smoke, prints the server log on failure, and kills
      # the server — the Makefile owns the recipe.
      - name: Live topology smoke
        run: make ui-e2e
