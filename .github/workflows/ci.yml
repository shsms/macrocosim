name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format + clippy + cargo test (lib, bin, integration). tulisp /
  # tulisp-async / tulisp-fmt are normal crates.io releases per
  # Cargo.toml; the proto roots (microgrid, assets, dispatch) are
  # vendored as this repo's own submodules, so `submodules:
  # recursive` is all the checkout needs.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  # Check the whole ui-assets/ directory (HTML, CSS, and hand-written
  # JS), then run the node gates over it. Vendored libs elsewhere in
  # the repo are untouched because `check` is scoped to the ui-assets
  # path argument below. `check` also runs the organizeImports assist,
  # not just the linter, so an unsorted import/export specifier list
  # fails as an error too.
  ui-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: biome check
        # Pinned to the same version as biome.json's $schema.
        run: npx --yes @biomejs/biome@2.4.14 check ui-assets

      # Parser/renderer round-trip against the crate's own rendering,
      # plus the subtraction-parity tinting the panel reads back.
      - name: formula-ast tests
        run: node tools/formula-ast-test.mjs

      # Ring push/read windowing, PF derivation, and display
      # formatting for the metrics panel's DOM-free sample store.
      - name: metrics-store tests
        run: node tools/metrics-store-test.mjs

      # The weather panel's split contract: the cloud LIST drops what
      # the sky is already past (filtered against the server's stamp,
      # not the browser's clock), while the day CURVE keeps drawing it.
      - name: weather-panel tests
        run: node tools/weather-panel-test.mjs

      # Where an unplaced floating card cascades to: the first free
      # slot, read from the open cards' positions.
      - name: panel-geometry tests
        run: node tools/panel-geometry-test.mjs

      # The dock strips' pure model: how tiles share a strip, what
      # order survives a tile leaving, and the size clamp.
      - name: panel-dock tests
        run: node tools/panel-dock-test.mjs

      # Executes the whole ES-module import graph under a DOM shim —
      # catches a TDZ / class-ordering error or a renamed export that
      # serving the file happily would not.
      - name: boot smoke
        run: node tools/boot-smoke.mjs

  # Lint, format-check, and type-check the Python client under python/.
  # Dev tools + dependencies only: `--no-install-project` skips building
  # the maturin (Rust) wheel — ruff and ty analyze the source and only
  # need the dependencies resolvable, so the job stays fast (no cargo,
  # protoc, or submodules). Cheap enough to run on every PR unfiltered.
  python-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Sync dev tools
        run: uv sync --no-install-project

      # `--no-sync` keeps `uv run` from re-syncing WITH the project,
      # which would defeat `--no-install-project` above and kick off
      # the maturin build after all.
      - name: Ruff lint
        run: uv run --no-sync ruff check src tests examples

      - name: Ruff format
        run: uv run --no-sync ruff format --check src tests examples

      - name: Type check (ty, all rules as errors)
        run: uv run --no-sync ty check --error all src

  # Live browser smoke: boots the binary against a scratch Berlin-demo
  # microgrid (same recipe AGENTS.md documents for running
  # tools/ui-smoke/live-topology.mjs by hand) and drives the real SPA
  # with Playwright/Chromium — inspector knobs, dialogs, the metrics
  # panel, hover cards, the steam-boiler round trip end to end.
  # `ui-lint`'s DOM-shim boot smoke misses regressions here since
  # it never drives a browser against a live server.
  ui-e2e:
    runs-on: ubuntu-latest
    # Only `rust`: this is also the sole job that boots the binary,
    # so a JS lint failure must not skip the server-boot signal.
    needs: rust
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build macrocosim binary
        run: cargo build --bin macrocosim

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache the downloaded Chromium build, keyed on the pin below —
      # bump the key alongside the version whenever it moves.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.1

      # No package.json in this repo — tools/ui-smoke's only dependency
      # is the playwright package itself, so it's installed loose,
      # pinned to the version node_modules carries locally (1.62.1)
      # rather than a lockfile.
      - name: Install Playwright + Chromium
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      # Same scratch state-dir recipe AGENTS.md gives for the live
      # smoke: seed microgrids/2200.lisp from the Berlin demo, boot
      # ephemeral, and read the UI port back out of --emit-endpoints'
      # JSON. Bounded, unlike AGENTS.md's unbounded `until`, so a
      # boot failure fails the job instead of hanging it.
      - name: Boot a scratch server
        run: |
          SD=$(mktemp -d)
          mkdir "$SD/microgrids"
          cp examples/berlin-demo.lisp "$SD/microgrids/2200.lisp"
          ./target/debug/macrocosim --state-dir "$SD" --ephemeral-ports \
              --emit-endpoints="$SD/endpoints.json" "$SD/microgrids/2200.lisp" \
              > /tmp/mc-e2e.log 2>&1 &
          echo $! > /tmp/mc-e2e.pid
          for _ in {1..30}; do
            [ -f "$SD/endpoints.json" ] && break
            sleep 1
          done
          if [ ! -f "$SD/endpoints.json" ]; then
            echo "server failed to emit endpoints"
            cat /tmp/mc-e2e.log
            exit 1
          fi
          echo "MACROCOSIM_UI=http://$(jq -r .ui "$SD/endpoints.json")" >> "$GITHUB_ENV"

      - name: Live topology smoke
        run: node tools/ui-smoke/live-topology.mjs

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/mc-e2e.log 2>/dev/null || true

      - name: Kill the server
        if: always()
        run: kill "$(cat /tmp/mc-e2e.pid 2>/dev/null)" 2>/dev/null || true
