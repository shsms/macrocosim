[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "switchyard"
version = "0.0.0"
description = "Python integration-testing client for the switchyard microgrid simulator"
readme = "README.md"
requires-python = ">=3.11"
# The core (process launch + the HTTP /api control plane) needs only httpx.
# The gRPC Microgrid client stays an optional extra (it pulls grpcio) — add
# it for component reads, setpoints, and bounds.
dependencies = [
    "frequenz-quantities>=1.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
grpc = ["frequenz-client-microgrid~=0.18"]

# Auto-load the pytest fixtures when both packages are installed.
[project.entry-points.pytest11]
switchyard = "switchyard.pytest_plugin"

# uv-native dev tooling (PEP 735). `uv sync` installs this by default; the
# gRPC client is here too so tests + type-checking see the full surface.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "frequenz-client-microgrid~=0.18",
    "ty>=0.0.56",
]

# maturin builds the switchyard + swctl binaries from the Rust crate at the
# repo root and bundles them into the (platform-specific) wheel as scripts,
# alongside the pure-Python `switchyard` package under src/. Downstream
# `pip install switchyard` then puts the binaries on PATH, where launch()'s
# discovery finds them — no separate binary download.
[tool.maturin]
manifest-path = "../Cargo.toml"
bindings = "bin"
python-source = "src"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# The microgrid client decodes samples through its own deprecated
# ComponentId (0.18.3 internal inconsistency) — not our code.
filterwarnings = [
    "ignore:frequenz.client.common.microgrid.components.ComponentId is deprecated:DeprecationWarning",
]
