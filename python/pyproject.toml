[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "macrocosim"
# The version comes from ../Cargo.toml (maturin converts a semver
# pre-release like 0.1.0-alpha.1 to PEP 440's 0.1.0a1).
dynamic = ["version"]
description = "Python integration-testing client for the macrocosim microgrid simulator"
readme = "README.md"
# The Python code is MIT. The wheel also bundles the macrocosim + macroctl
# binaries, which are GPL-3.0-only (see LICENSE-GPL-3.0 and the README).
license = "MIT"
license-files = ["LICENSE-MIT", "LICENSE-GPL-3.0"]
requires-python = ">=3.11"
dependencies = [
    "frequenz-quantities>=1.0.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
    "frequenz-client-microgrid~=0.18",
    "ty>=0.0.56",
]

# maturin builds the macrocosim + macroctl binaries from the Rust crate at the
# repo root and bundles them into the (platform-specific) wheel as scripts,
# alongside the pure-Python `macrocosim` package under src/. Downstream
# `pip install macrocosim` then puts the binaries on PATH, where launch()'s
# discovery finds them — no separate binary download.
[tool.maturin]
manifest-path = "../Cargo.toml"
bindings = "bin"
python-source = "src"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# The suite only; CI runs examples/pytest_demo separately.
testpaths = ["tests"]
# The async tests and fixtures; auto mode runs `async def test_*` without a
# per-test marker.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_debug = true
filterwarnings = ["error"]
