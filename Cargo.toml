[package]
name = "macrocosim"
version = "0.2.0-alpha.0"
edition = "2024"
license = "GPL-3.0-only"
default-run = "macrocosim"
publish = false

[dependencies]
tonic-prost = "0.14"
tonic = "0.14.0"
prost = "0.14.0"
prost-types = "0.14.0"
# `process` and `io-util` run the `.py` export's Python (src/python.rs,
# src/ui/handlers/spec.rs).
tokio = { version = "1.43.1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util"] }
tokio-stream = "0.1.15"
# DAG validation + formula generation for the Dashboard's aggregated
# tiles. Macrocosim implements Node + Edge on its own component /
# connection types in src/sim/graph_adapter.rs.
frequenz-microgrid-component-graph = "0.6.2"
# High-level Microgrid client + typed metric streams. The UI runs
# this as a client of each microgrid's Microgrid service over an
# in-memory channel (src/runtime.rs, supervised by
# src/ui/loopback.rs): aggregated Dashboard tiles read from the same
# LogicalMeterHandle::xxx<M>().subscribe() streams a production
# downstream control app would consume.
frequenz-microgrid = "0.7.1"
log = "0.4.22"
simplelog = "0.12.2"
rand = { version = "0.8.5", features = ["small_rng"] }
chrono = { version = "0.4.42", features = ["serde"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a number read back from `GET /spec` parses to the same
# f64, so sending a spec back unchanged never breaks a rebuild's carry.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The JSON Schema of the topology document (`src/spec/schema.rs`), served at
# run time. Pinned to one minor version: a schemars release may change the
# schema it writes.
schemars = "~1.2"
rust-embed = "8"
# macroctl reads the UI server's HTTP surface to find a microgrid's gRPC
# server and for its pool and dashboard readouts.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# In-memory gRPC channel for the UI's loopback client (`runtime.rs`);
# tower's `util` also serves the axum oneshot tests.
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[build-dependencies]
tonic-prost-build = { version = "0.14", features = ["cleanup-markdown"] }

[dev-dependencies]
# Out-of-process integration tests in tests/ talk to the live
# HTTP / gRPC surface; reqwest is already a regular dep for macroctl,
# we just need a temp dir for per-test files.
tempfile = "3"
futures = "0.3.30"

[lib]
name = "macrocosim"
path = "src/lib.rs"

[[bin]]
name = "macrocosim"
path = "src/bin/macrocosim.rs"

[[bin]]
name = "macroctl"
path = "src/bin/macroctl.rs"
